plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"anglers-odyssey" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

def versionedArchiveName = "${project.name}-${project.mod_version}-mc-${project.minecraft_version}"

tasks.withType(AbstractArchiveTask).configureEach {
	archiveBaseName = versionedArchiveName
	archiveVersion = ""
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

tasks.register("validateFishCatalog") {
	group = "verification"
	description = "Checks the canonical fish catalog and its habitat tags."
	doLast {
		def source = file("src/main/java/grubbs/anglersodyssey/fish/FishDatabase.java").getText("UTF-8")
		def fish = (source =~ /new FishData\("([^"]+)",\s*"([^"]+)",\s*FishRarity\.([A-Z]+),\s*"([^"]+)"\)/).collect { [id: it[1], habitat: it[4]] }
		assert fish.size() == 151 : "Expected 151 fish, found ${fish.size()}"
		assert fish*.id.toSet().size() == fish.size() : "Fish identifiers must be unique"
		def regionFiles = fileTree("src/main/resources/data/anglers_odyssey/tags/worldgen/biome/regions")
			.matching { include "*.json" }
			.collect { it.name - ".json" }
		def supported = (["River", "Swamp", "Beach", "Ocean", "Cold Ocean", "Frozen River", "Warm Ocean", "Mangrove Swamp", "Jungle", "Cherry Grove", "Deep Cold Ocean", "Frozen Ocean", "Grove", "Jagged Peaks", "Deep Ocean", "Stony Shore"] as Set)
		assert fish*.habitat.every { supported.contains(it) } : "Fish references an unclassified habitat"
		assert fish*.habitat.findAll { it in ["River", "Swamp", "Beach", "Ocean", "Cold Ocean", "Frozen River", "Warm Ocean", "Mangrove Swamp", "Jungle", "Cherry Grove", "Deep Cold Ocean", "Frozen Ocean", "Grove", "Jagged Peaks", "Deep Ocean", "Stony Shore"] }.every { regionFiles.contains(it.toLowerCase().replace(" ", "_")) } : "Fish habitat tag missing"
	}
}

tasks.register("validateBiomeCoverage") {
	group = "verification"
	description = "Checks that every extracted 1.21.1 vanilla biome has a coverage decision."
	doLast {
		def rows = file("docs/compatibility/biomes-1.21.1.csv").readLines().findAll { it && !it.startsWith("biome,") }
		assert rows.size() == 64 : "Expected 64 vanilla 1.21.1 biome rows, found ${rows.size()}"
		assert rows.every { it.split(",", -1).size() >= 3 && it.split(",", -1)[1] in ["fishable", "excluded", "handled"] } : "Every biome needs a coverage classification"
	}
}

tasks.register("validateVersionedData") {
	group = "verification"
	description = "Checks 1.21.x loot, recipe, and advancement formats for component-era schema changes."
	doLast {
		def lootFiles = fileTree("src/main/resources/data/anglers_odyssey/loot_table")
			.matching { include "**/*.json" }
		assert !lootFiles.any { it.getText("UTF-8").contains('"minecraft:set_nbt"') } : "Legacy set_nbt remains in a 1.21 loot table"
		assert lootFiles.findAll { it.getText("UTF-8").contains('"minecraft:set_custom_data"') }.size() >= 5 : "Expected fish shiny-data loot functions are missing"
		assert file("src/main/resources/data/minecraft/loot_table/gameplay/fishing/fish.json").isFile() : "The 1.21 fishing loot override must use the singular loot_table path"
		assert !file("src/main/resources/data/minecraft/loot_tables/gameplay/fishing/fish.json").isFile() : "The obsolete plural 1.20 fishing loot override must not remain"
		def fishingOverride = file("src/main/resources/data/minecraft/loot_table/gameplay/fishing/fish.json").getText("UTF-8")
		assert fishingOverride.count('"type": "minecraft:loot_table"') == fishingOverride.count('"value": "anglers_odyssey:gameplay/fishing/') : "1.21 nested fishing loot tables must use value"

		def cookingRecipes = fileTree("src/main/resources/data/anglers_odyssey/recipe/cooking")
			.matching { include "**/*.json" }
		assert cookingRecipes && cookingRecipes.every { it.getText("UTF-8") =~ /"result"\s*:\s*\{\s*"id"/ } : "1.21 cooking recipes must use object results with an id"

		def advancements = fileTree("src/main/resources/data/anglers_odyssey/advancement")
			.matching { include "**/*.json" }
		assert advancements && advancements.every { !it.getText("UTF-8").contains('"icon"') || it.getText("UTF-8") =~ /"icon"[\s\S]*?"id"/ } : "1.21 advancement icons must use id"
	}
}

check.dependsOn(tasks.named("validateFishCatalog"), tasks.named("validateBiomeCoverage"), tasks.named("validateVersionedData"))

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
