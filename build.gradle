plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def versionedArchiveName = "${project.name}-${project.mod_version}-mc-${project.minecraft_version}"

tasks.withType(AbstractArchiveTask).configureEach {
	archiveBaseName = versionedArchiveName
	archiveVersion = ""
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()
	def serverRunDirectory = project.findProperty("run_dir") ?: "run"
	runs {
		server {
			server()
			runDir serverRunDirectory
		}
	}

	mods {
		"anglers-odyssey" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

    def adapterBand = project.minecraft_version in ["1.21", "1.21.1"] ? "modern" : (project.minecraft_version in ["1.21.2", "1.21.3"] ? "modern2" : (project.minecraft_version == "1.21.4" ? "modern3" : (project.minecraft_version == "1.21.5" ? "modern4" : (project.minecraft_version in ["1.21.6", "1.21.7", "1.21.8"] ? "modern5" : (project.minecraft_version.startsWith("1.21") ? "modern6" : (project.minecraft_version in ["1.20.5", "1.20.6"] ? "component" : "legacy"))))))
sourceSets.main.java.setSrcDirs(["src/${adapterBand}/java"])
sourceSets.client.java.setSrcDirs(["src/${adapterBand}-client/java"])
sourceSets.main.resources.setSrcDirs(["src/${adapterBand}/resources"])
// Client resources are already packaged by the main source set. Reusing the
// directory here causes Loom's jar task to see every resource twice.
sourceSets.client.resources.setSrcDirs([])

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	def version = project.version
	inputs.properties(
		"version": version,
		"minecraft_version": project.minecraft_version,
		"loader_version": project.loader_version,
		"java_version": project.java_version
	)

	filesMatching("fabric.mod.json") {
		expand(
			"version": version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version,
			"java_version": project.java_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version.toInteger()
}

tasks.register("validateCompatibility") {
	group = "verification"
	description = "Validate the version adapter's fish, advancement, biome, and JSON resource invariants."
	doLast {
		def resourceRoot = file("src/${adapterBand}/resources")
		def commonRoot = file("src/${adapterBand}/java")
		def jsonFiles = fileTree(resourceRoot).matching { include "data/anglers_odyssey/**/*.json" }.files
		def advancements = fileTree(resourceRoot).matching { include adapterBand in ["modern", "modern2", "modern3", "modern4", "modern5", "modern6"] ? "data/anglers_odyssey/advancement/*.json" : "data/anglers_odyssey/advancements/*.json" }.files
		def fishingLoot = fileTree(resourceRoot).matching { include adapterBand in ["modern", "modern2", "modern3", "modern4", "modern5", "modern6"] ? "data/anglers_odyssey/loot_table/gameplay/fishing/*.json" : "data/anglers_odyssey/loot_tables/gameplay/fishing/*.json" }.files
		def biomeRegions = fileTree(resourceRoot).matching { include "data/anglers_odyssey/tags/worldgen/biome/regions/*.json" }.files
		def fishData = file("${commonRoot}/grubbs/anglersodyssey/fish/FishDatabase.java")
		assert fishData.exists(): "Fish database is missing for ${adapterBand} adapter"
		assert fishData.text.count("new FishData(") == 151: "Expected 151 fish definitions"
		assert advancements.size() == 69: "Expected 69 advancement files, found ${advancements.size()}"
		assert fishingLoot.size() == 5: "Expected five rarity fishing loot tables, found ${fishingLoot.size()}"
		assert biomeRegions.size() == 16: "Expected 16 biome region tags, found ${biomeRegions.size()}"
		jsonFiles.each {
			def jsonText = it.getText("UTF-8").replaceFirst(/^\uFEFF/, "")
			new groovy.json.JsonSlurper().parseText(jsonText)
		}
		println "Compatibility invariants passed for ${project.minecraft_version} (${adapterBand} adapter): 151 fish, 69 advancements, 16 biome regions, five fishing tables, ${jsonFiles.size()} valid JSON files."
	}
}

check.dependsOn(tasks.named("validateCompatibility"))

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
