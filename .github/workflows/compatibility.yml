name: compatibility

on:
  pull_request:
  push:

jobs:
  version:
    strategy:
      fail-fast: false
      matrix:
        # Add a release only after its adapter and validation gates exist.
        minecraft: ["1.21.1"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and validate ${{ matrix.minecraft }}
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }}
      - name: upload versioned artifact
        uses: actions/upload-artifact@v7
        with:
          name: anglers-odyssey-${{ matrix.minecraft }}
          path: |
            build/libs/*mc-${{ matrix.minecraft }}*.jar
            docs/compatibility/**
