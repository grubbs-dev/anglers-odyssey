# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.2'
            yarn: '1.20.2+build.4'
            loader: '0.14.22'
            fabric_api: '0.89.2+1.20.2'
            mod: '1.0.2'
            java: '17'
          - minecraft: '1.20.3'
            yarn: '1.20.3+build.1'
            loader: '0.15.0'
            fabric_api: '0.91.1+1.20.3'
            mod: '1.0.3'
            java: '17'
          - minecraft: '1.20.4'
            yarn: '1.20.4+build.3'
            loader: '0.15.6'
            fabric_api: '0.97.3+1.20.4'
            mod: '1.0.4'
            java: '17'
          - minecraft: '1.20.5'
            yarn: '1.20.5+build.1'
            loader: '0.15.10'
            fabric_api: '0.97.8+1.20.5'
            mod: '1.0.5'
            java: '21'
          - minecraft: '1.20.6'
            yarn: '1.20.6+build.3'
            loader: '0.15.11'
            fabric_api: '0.100.8+1.20.6'
            mod: '1.0.6'
            java: '21'
          - minecraft: '1.21'
            yarn: '1.21+build.9'
            loader: '0.19.5'
            fabric_api: '0.102.0+1.21'
            mod: '1.2.0'
            java: '21'
          - minecraft: '1.21.1'
            yarn: '1.21.1+build.3'
            loader: '0.19.5'
            fabric_api: '0.116.17+1.21.1'
            mod: '1.2.1'
            java: '21'
          - minecraft: '1.21.2'
            yarn: '1.21.2+build.1'
            loader: '0.19.5'
            fabric_api: '0.106.1+1.21.2'
            mod: '1.2.2'
            java: '21'
          - minecraft: '1.21.3'
            yarn: '1.21.3+build.2'
            loader: '0.19.5'
            fabric_api: '0.114.1+1.21.3'
            mod: '1.2.3'
            java: '21'
          - minecraft: '1.21.4'
            yarn: '1.21.4+build.8'
            loader: '0.19.5'
            fabric_api: '0.119.4+1.21.4'
            mod: '1.2.4'
            java: '21'
          - minecraft: '1.21.5'
            yarn: '1.21.5+build.1'
            loader: '0.19.5'
            fabric_api: '0.128.2+1.21.5'
            mod: '1.2.5'
            java: '21'
          - minecraft: '1.21.6'
            yarn: '1.21.6+build.1'
            loader: '0.19.5'
            fabric_api: '0.128.2+1.21.6'
            mod: '1.2.6'
            java: '21'
          - minecraft: '1.21.7'
            yarn: '1.21.7+build.8'
            loader: '0.19.5'
            fabric_api: '0.129.0+1.21.7'
            mod: '1.2.7'
            java: '21'
          - minecraft: '1.21.8'
            yarn: '1.21.8+build.1'
            loader: '0.19.5'
            fabric_api: '0.136.1+1.21.8'
            mod: '1.2.8'
            java: '21'
          - minecraft: '1.21.9'
            yarn: '1.21.9+build.1'
            loader: '0.19.5'
            fabric_api: '0.134.1+1.21.9'
            mod: '1.2.9'
            java: '21'
          - minecraft: '1.21.10'
            yarn: '1.21.10+build.3'
            loader: '0.19.5'
            fabric_api: '0.138.4+1.21.10'
            mod: '1.2.10'
            java: '21'
          - minecraft: '1.21.11'
            yarn: '1.21.11+build.6'
            loader: '0.19.5'
            fabric_api: '0.141.6+1.21.11'
            mod: '1.2.11'
            java: '21'
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Fabric Loom 1.16.3 requires a Java 21 runtime to configure Gradle.
          # The matrix's java value remains the target Java requirement written
          # into each mod artifact, so 1.20.2–1.20.4 still declare Java 17.
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew clean build --no-daemon -Pminecraft_version=${{ matrix.minecraft }} -Pyarn_mappings=${{ matrix.yarn }} -Ploader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.fabric_api }} -Pmod_version=${{ matrix.mod }} -Pjava_version=${{ matrix.java }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anglers-odyssey-mc-${{ matrix.minecraft }}
          path: build/libs/*-mc-${{ matrix.minecraft }}.jar
